<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Hibrido</title>
</head>
<body>

<header>
    <div class="izquierda">
        <h1>Dashboard</h1>
    </div>
    <div class="derecha">
        <button>🔔</button>
        <button>⚙️</button>
    </div>
</header>

<aside class="menu">
    <ul class="lista">
        <li class="item"><a>Inicio</a></li>
        <li class="item"><a>Reportes</a></li>
        <li class="item"><a>Usuarios</a></li>
        <li class="item"><a>Productos</a></li>
    </ul>
</aside>

<main class="contenido">
    <div class="tarjeta">
        <div class="encabezado">
            <p>Ventas</p>
            <span class="estado-verde">+12%</span>
        </div>
        <div class="cantidad">🛒 1,234</div>
    </div>

    <div class="tarjeta">
        <div class="encabezado">
            <p>Usuarios</p>
            <span class="estado-violeta">+8%</span>
        </div>
        <div class="cantidad">👤 567</div>
    </div>

    <div class="tarjeta">
        <div class="encabezado">
            <p>Pedidos</p>
            <span class="estado-naranja">+5%</span>
        </div>
        <div class="cantidad">🚚 89</div>
    </div>
</main>

<footer class="footer">© 2026 Dashboard Layout</footer>

</body>
</html>
