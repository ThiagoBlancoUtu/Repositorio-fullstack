<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Posiciones Grid</title>
</head>
<body>

    <section class="caja azul">start/start</section>
    <section class="caja verde">↑<br>center/start</section>
    <section class="caja amarillo">end/start</section>

    <section class="caja rojo">←<br>start/center</section>
    <section class="caja violeta">center/center</section>
    <section class="caja rosa">→<br>end/center</section>

    <section class="caja celeste">start/end</section>
    <section class="caja lima">↓<br>center/end</section>
    <section class="caja naranja">end/end</section>

</body>
</html>
